[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "schematic-mcp"
version = "0.1.0"
description = "MCP server that enables AI agents to inspect and reason over hardware schematics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SYANKOR" }]
keywords = ["mcp", "schematic", "kicad", "hardware", "eda", "ai-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
]

[project.scripts]
schematic-mcp = "schematic_mcp.server:main"

[project.urls]
Homepage = "https://github.com/vonpanda/schematic-mcp"
Repository = "https://github.com/vonpanda/schematic-mcp"
Issues = "https://github.com/vonpanda/schematic-mcp/issues"
Changelog = "https://github.com/vonpanda/schematic-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/vonpanda/schematic-mcp/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
